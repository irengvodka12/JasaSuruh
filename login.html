<!doctype html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Masuk — JasaSuruh</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body class="auth-page">
  <div class="auth-shell">
    <a class="brand auth-brand" href="index.html"><span class="brand-mark">JS</span><span>JasaSuruh</span></a>
    <div class="auth-card"><span class="eyebrow">Selamat datang kembali</span><h1>Masuk ke akun</h1><p class="muted">Kelola pesanan dan layananmu dari satu tempat.</p>
      <form id="loginForm" class="form-grid">
        <label>Email<input type="email" name="email" required placeholder="nama@email.com"></label>
        <label>Password<input type="password" name="password" required placeholder="••••••••"></label>
        <button class="btn btn-primary btn-lg" type="submit">Masuk</button>
        <div id="formMessage" class="form-message"></div>
      </form>
      <p class="auth-footer">Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
    </div>
  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
